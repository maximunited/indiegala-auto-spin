services:
  spin:
    build: .
    env_file: .env
    environment:
      INDIEGALA_SESSION_DIR: /data/session
      # Optional: Discord/Slack-compatible webhook for failure alerts
      # NOTIFY_WEBHOOK: ${NOTIFY_WEBHOOK:-}
    volumes:
      - indiegala-session:/data/session
    # Chrome needs shared memory; default 64MB is too small
    shm_size: "2gb"
    # Uncomment for a one-shot cron-style host schedule:
    # profiles: ["manual"]

volumes:
  indiegala-session:
